hydra:
  run:
    dir: outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun_outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: configs
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - dataset=image_folder
    - dataset.video_path=/workspace/sn-gamestate/videos/001_brentford_v_mun/videos/brentford_v_mun_037_frames
    - dataset.eval_set=val
    - eval_tracking=false
    - visualization=none
    - pipeline=[bbox_detector,reid,track,pitch,calibration,tracklet_agg,team,team_side]
    - modules.tracklet_agg.cfg.attributes=[role]
  job:
    name: main
    chdir: true
    override_dirname: dataset.eval_set=val,dataset.video_path=/workspace/sn-gamestate/videos/001_brentford_v_mun/videos/brentford_v_mun_037_frames,dataset=image_folder,eval_tracking=false,modules.tracklet_agg.cfg.attributes=[role],pipeline=[bbox_detector,reid,track,pitch,calibration,tracklet_agg,team,team_side],visualization=none
    id: ???
    num: ???
    config_name: soccernet
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /workspace/sn-gamestate
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: tracklab.configs
      schema: pkg
      provider: main
    - path: sn_gamestate.configs
      schema: pkg
      provider: tracklab
    - path: ''
      schema: structured
      provider: schema
    output_dir: /workspace/sn-gamestate/outputs/sn-gamestate/2026-10-14/19-17-36
    choices:
      modules/calibration: nbjw_calib
      modules/pitch: nbjw_calib
      modules/tracklet_agg: voting_role_jn
      modules/team_side: mean_position
      modules/team: kmeans_embeddings
      modules/jersey_number_detect: mmocr
      modules/track: bpbreid_strong_sort
      modules/reid: prtreid
      modules/reid/dataset: prtreid_dataset
      modules/bbox_detector: yolo_ultralytics
      visualization: none
      engine: offline
      eval: gs_hota
      dataset: image_folder
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
